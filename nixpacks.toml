[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "postgresql", "gcc", "g++", "clang", "python311Packages.virtualenv"]

[phases.install]
cmds = [
  "python3 -m venv /app/venv",
  "/app/venv/bin/pip install --upgrade pip",
  "/app/venv/bin/pip install -r requirements.txt"
]

[phases.build]
cmds = [
  "/app/venv/bin/pip install psycopg2-binary",
  "/app/venv/bin/pip install semgrep"
]

[start]
cmd = "/app/venv/bin/gunicorn run:app --bind 0.0.0.0:$PORT"

[deploy]
healthcheck = "/health"
restartPolicyType = "ON_FAILURE"
