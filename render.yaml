services:
  - type: web
    name: vast-scanner
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python -c "from app import create_app, db; app = create_app(); app.app_context().push(); db.create_all(); print('Database ready')"
    startCommand: gunicorn run:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
